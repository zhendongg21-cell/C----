<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>基于 ESP32-S3 的智能健康手环 · 交互式思维导图</title>
<style>
:root[data-theme="dark"]{
  --bg:#0B1220; --bg2:#08101D; --panel:#111C2F; --card:#152238; --card2:#1B2B45;
  --line:#2A3B57; --txt:#F8FAFC; --sub:#94A3B8; --dim:#5B6B85;
  --shadow:0 6px 22px rgba(0,0,0,.42); --bar:rgba(17,28,47,.92);
  --hit:#FBBF24; --root:#F8FAFC;
}
:root[data-theme="light"]{
  --bg:#EEF2F8; --bg2:#E4EAF3; --panel:#FFFFFF; --card:#FFFFFF; --card2:#F7FAFD;
  --line:#CBD5E1; --txt:#0F172A; --sub:#475569; --dim:#94A3B8;
  --shadow:0 4px 16px rgba(15,23,42,.10); --bar:rgba(255,255,255,.94);
  --hit:#D97706; --root:#0F172A;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--txt)}
body{display:flex;flex-direction:column;overflow:hidden}

/* ---------- 顶部工具栏 ---------- */
.toolbar{flex:0 0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:10px 18px;background:var(--bar);border-bottom:1px solid var(--line);
  backdrop-filter:blur(10px);z-index:20}
.brand{display:flex;align-items:center;gap:10px;margin-right:6px}
.brand .dot{width:11px;height:11px;border-radius:50%;background:#2DD4BF;box-shadow:0 0 10px #2DD4BF}
.brand b{font-size:14px;letter-spacing:.4px}
.brand span{font-size:11px;color:var(--dim)}
.spacer{flex:1 1 auto}
.btn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--txt);
  font:12px/1 inherit;padding:8px 12px;border-radius:8px;cursor:pointer;transition:.18s;white-space:nowrap}
.btn:hover{border-color:#2DD4BF;color:#2DD4BF;transform:translateY(-1px)}
.btn.primary{background:#2DD4BF;border-color:#2DD4BF;color:#06211D;font-weight:700}
.btn.primary:hover{filter:brightness(1.1);color:#06211D}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{appearance:none;border:0;background:transparent;color:var(--sub);font:12px/1 inherit;
  padding:8px 11px;cursor:pointer}
.seg button.on{background:var(--card2);color:var(--txt);font-weight:700}
.search{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);
  border-radius:8px;padding:0 10px}
.search input{border:0;background:transparent;color:var(--txt);font:12px/1 inherit;
  padding:9px 4px;width:168px;outline:none}
.search input::placeholder{color:var(--dim)}
#hint{font-size:11px;color:var(--dim);min-width:74px;text-align:right}
.zoomval{font-size:11px;color:var(--sub);min-width:38px;text-align:center}

/* ---------- 画布 ---------- */
.viewport{flex:1 1 auto;overflow:auto;position:relative;
  background:radial-gradient(circle at 18% 12%,rgba(45,212,191,.055),transparent 42%),
             radial-gradient(circle at 82% 78%,rgba(96,165,250,.05),transparent 45%),var(--bg)}
.stage{position:relative;margin:0}
.canvas{position:absolute;left:0;top:0;transform-origin:0 0;
  padding:34px 60px 70px 34px;width:max-content}
.links{position:absolute;left:0;top:0;z-index:0;pointer-events:none;overflow:visible}
.links path{fill:none;stroke-width:2;opacity:.62;stroke-linecap:round}

.branch{position:relative;z-index:1}
.children{margin-left:46px;padding-top:6px;padding-bottom:2px;
  border-left:0;display:flex;flex-direction:column;gap:6px}
.children.collapsed{display:none}
.node{position:relative;display:flex;align-items:flex-start;gap:9px;
  background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c,#2DD4BF);
  border-radius:10px;padding:9px 12px;box-shadow:var(--shadow);cursor:default;
  max-width:640px;min-width:170px;transition:border-color .18s,transform .18s,box-shadow .18s}
.node.has-children{cursor:pointer}
.node.has-children:hover{transform:translateX(3px);box-shadow:0 8px 26px rgba(0,0,0,.30)}
.node .txt{flex:1 1 auto;min-width:0}
.node .t{font-size:13px;font-weight:700;line-height:1.45;color:var(--txt);word-break:break-word}
.node .d{font-size:11px;line-height:1.55;color:var(--sub);margin-top:3px;word-break:break-word}
.node .tg{flex:0 0 auto;align-self:center;width:19px;height:19px;border-radius:5px;
  border:1px solid var(--line);background:var(--card2);color:var(--sub);
  font-size:11px;line-height:17px;text-align:center;user-select:none}
.node .cnt{flex:0 0 auto;align-self:center;font-size:10px;color:var(--dim);
  background:var(--card2);border:1px solid var(--line);border-radius:20px;padding:2px 7px}
.node.root{background:linear-gradient(120deg,var(--card2),var(--card));
  border:1px solid var(--c);border-left:6px solid var(--c);padding:16px 20px;max-width:520px}
.node.root .t{font-size:20px;letter-spacing:.5px}
.node.root .d{font-size:12px;margin-top:6px}
.node.l1{background:var(--panel)}
.node.l1 .t{font-size:14px}
.node.l3,.node.l4{background:var(--card2);border-left-width:3px}
.node.l3 .t,.node.l4 .t{font-size:12px;font-weight:600}
.node.hit{outline:2px solid var(--hit);outline-offset:2px;
  box-shadow:0 0 0 5px rgba(251,191,36,.14),var(--shadow)}

/* ---------- 页脚 ---------- */
.foot{flex:0 0 auto;display:flex;gap:18px;align-items:center;flex-wrap:wrap;
  padding:8px 18px;border-top:1px solid var(--line);background:var(--bar);
  font-size:11px;color:var(--dim)}
.foot b{color:var(--sub);font-weight:600}
.foot .k{color:#2DD4BF;font-weight:700}
.legend{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px}

@media print{
  .toolbar,.foot{display:none}
  .viewport{overflow:visible}
  body{overflow:visible;background:#fff}
}
</style>
</head>
<body>

<div class="toolbar">
  <div class="brand"><span class="dot"></span>
    <div><b>ESP32-S3 智能健康手环 · 思维导图</b><br>
    <span>课程设计说明书（C++版）｜八章 + 三附录 · 点击节点展开 / 折叠</span></div>
  </div>
  <div class="spacer"></div>
  <div class="search">
    <span style="color:var(--dim);font-size:12px">⌕</span>
    <input id="q" type="search" placeholder="搜索节点，如 引脚 / 计步 / 考核" autocomplete="off">
  </div>
  <span id="hint">共 0 个节点</span>
  <div class="seg" id="themeSeg">
    <button data-t="dark" class="on">深色</button>
    <button data-t="light">浅色</button>
  </div>
  <button class="btn" id="expandAll">全部展开</button>
  <button class="btn" id="collapseAll">全部折叠</button>
  <div class="seg">
    <button class="btn" id="zoomOut" style="border:0;border-radius:0">−</button>
    <span class="zoomval" id="zoomVal">100%</span>
    <button class="btn" id="zoomIn" style="border:0;border-radius:0">＋</button>
  </div>
  <button class="btn primary" id="fit">适应宽度</button>
</div>

<div class="viewport" id="viewport">
  <div class="stage" id="stage">
    <div class="canvas" id="canvas">
      <svg class="links" id="links" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="tree"></div>
    </div>
  </div>
</div>

<div class="foot">
  <span><b>操作：</b>点击带 ▾ 的节点展开 / 折叠 · 搜索自动展开命中路径 · 深浅主题可切换</span>
  <span class="legend"><b>四大底线：</b>
    <span><i style="background:#2DD4BF"></i>提醒能触发</span>
    <span><i style="background:#60A5FA"></i>数据能显示</span>
    <span><i style="background:#FBBF24"></i>断电不丢设置</span>
    <span><i style="background:#FF5A6E"></i>连续运行不死机</span>
  </span>
  <span class="spacer"></span>
  <span><b>平台：</b><span class="k">ESP32-S3 · FreeRTOS · LVGL · C++17</span> ｜ 80 学时 · 10 天 · 3~4 人/组</span>
</div>

/* ===================== 配色 ===================== */
const PALETTE = {
  dark:['#2DD4BF','#60A5FA','#FBBF24','#FF5A6E','#A78BFA','#4ADE80','#22D3EE','#FB923C','#F472B6','#A3E635','#818CF8'],
  light:['#0D9488','#2563EB','#B45309','#E11D48','#7C3AED','#15803D','#0E7490','#C2410C','#BE185D','#4D7C0F','#4338CA']
};
let theme = localStorage.getItem('hb-theme') || 'dark';
let scale = 1;

const canvas = document.getElementById('canvas');
const stage  = document.getElementById('stage');
const svg    = document.getElementById('links');
const treeEl = document.getElementById('tree');
const viewport = document.getElementById('viewport');

let counter = 0;
const nodes = [];      // {id, el, text, toggleEl}
const edges = [];      // {from, to}
const byId  = {};

/* ---------- 渲染 ---------- */
function render(data, parentId, level, bi){
  const id = 'n' + (counter++);
  const branch = document.createElement('div');
  branch.className = 'branch';

  const el = document.createElement('div');
  el.className = 'node' + (level===0 ? ' root' : level===1 ? ' l1' : level>=3 ? ' l3' : '');
  el.dataset.id = id;
  el.dataset.bi = bi;
  if(parentId) el.dataset.parent = parentId;

  const txt = document.createElement('div');
  txt.className = 'txt';
  const t = document.createElement('div');
  t.className = 't'; t.textContent = data.t;
  txt.appendChild(t);
  if(data.d){
    const d = document.createElement('div');
    d.className = 'd'; d.textContent = data.d;
    txt.appendChild(d);
  }
  el.appendChild(txt);
  branch.appendChild(el);                       // 节点在前

  let childrenEl = null, toggleEl = null;
  if(data.c && data.c.length){
    el.classList.add('has-children');
    const cnt = document.createElement('span');
    cnt.className = 'cnt'; cnt.textContent = data.c.length;
    el.appendChild(cnt);
    toggleEl = document.createElement('span');
    toggleEl.className = 'tg'; toggleEl.textContent = '▾';
    el.appendChild(toggleEl);

    childrenEl = document.createElement('div');
    childrenEl.className = 'children';
    data.c.forEach((child, i) => {
      childrenEl.appendChild(render(child, id, level+1, level===0 ? i : bi));
    });
    if(level >= 2) childrenEl.classList.add('collapsed');
    branch.appendChild(childrenEl);           // 子节点容器在后
  }

  el.addEventListener('click', ev => {
    ev.stopPropagation();
    if(!childrenEl) return;
    childrenEl.classList.toggle('collapsed');
    syncToggles(); redraw();
  });

  if(parentId) edges.push({from:parentId, to:id});
  const rec = {id, el, text:(data.t + ' ' + (data.d||'')), toggleEl, childrenEl};
  nodes.push(rec); byId[id] = rec;
  return branch;
}

const rootId = 'n0';
(function build(){
  // 根节点单独渲染，保证一级分支各自拿到颜色索引
  const rootBranch = render(TREE, null, 0, -1);
  treeEl.appendChild(rootBranch);
  // 主题初始化
  document.documentElement.dataset.theme = theme;
  document.querySelectorAll('#themeSeg button').forEach(b => b.classList.toggle('on', b.dataset.t===theme));
  applyColors();
  syncToggles();
  document.getElementById('hint').textContent = '共 ' + nodes.length + ' 个节点';
  requestAnimationFrame(()=>{ redraw(); });
})();

/* ---------- 主题 ---------- */
function applyColors(){
  for(const n of nodes){
    const bi = +n.el.dataset.bi;
    const col = bi < 0
      ? getComputedStyle(document.documentElement).getPropertyValue('--root').trim()
      : PALETTE[theme][bi % PALETTE[theme].length];
    n.el.style.setProperty('--c', col);
  }
}
document.querySelectorAll('#themeSeg button').forEach(b=>{
  b.addEventListener('click', ()=>{
    theme = b.dataset.t;
    localStorage.setItem('hb-theme', theme);
    document.documentElement.dataset.theme = theme;
    document.querySelectorAll('#themeSeg button').forEach(x=>x.classList.toggle('on', x===b));
    applyColors(); redraw();
  });
});

/* ---------- 折叠状态 ---------- */
function syncToggles(){
  for(const n of nodes){
    if(n.toggleEl && n.childrenEl)
      n.toggleEl.textContent = n.childrenEl.classList.contains('collapsed') ? '▸' : '▾';
  }
}
function setAll(collapsed){
  for(const n of nodes){
    if(n.el.classList.contains('root') || !n.childrenEl) continue;
    n.childrenEl.classList.toggle('collapsed', collapsed);
  }
  syncToggles(); redraw();
}
function expandAncestors(el){
  let p = el.dataset.parent;
  while(p && byId[p]){
    const ch = byId[p].childrenEl;
    if(ch) ch.classList.remove('collapsed');
    p = byId[p].el.dataset.parent;
  }
  syncToggles();
}
document.getElementById('expandAll').addEventListener('click', ()=>setAll(false));
document.getElementById('collapseAll').addEventListener('click', ()=>setAll(true));

/* ---------- 缩放 ---------- */
function applyScale(){
  canvas.style.transform = 'scale(' + scale + ')';
  document.getElementById('zoomVal').textContent = Math.round(scale*100) + '%';
  redraw();
}
document.getElementById('zoomIn').addEventListener('click', ()=>{ scale=Math.min(1.6, +(scale+0.1).toFixed(2)); applyScale(); });
document.getElementById('zoomOut').addEventListener('click', ()=>{ scale=Math.max(0.5, +(scale-0.1).toFixed(2)); applyScale(); });
document.getElementById('fit').addEventListener('click', ()=>{
  scale = Math.max(0.5, Math.min(1, (viewport.clientWidth - 30) / Math.max(1, canvas.scrollWidth)));
  scale = +scale.toFixed(2); applyScale();
  viewport.scrollTo({left:0, top:0, behavior:'smooth'});
});

/* ---------- 连线 ---------- */
function visible(el){ return el.getClientRects().length > 0; }
function redraw(){
  const W = canvas.scrollWidth, H = canvas.scrollHeight;
  stage.style.width  = (W * scale) + 'px';
  stage.style.height = (H * scale) + 'px';
  svg.setAttribute('width', W);
  svg.setAttribute('height', H);
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  const cr = canvas.getBoundingClientRect();
  let out = '';
  for(const e of edges){
    const a = byId[e.from].el, b = byId[e.to].el;
    if(!visible(a) || !visible(b)) continue;
    const ar = a.getBoundingClientRect(), br = b.getBoundingClientRect();
    const x1 = (ar.right - cr.left) / scale;
    const y1 = ((ar.top + ar.bottom)/2 - cr.top) / scale;
    const x2 = (br.left - cr.left) / scale;
    const y2 = ((br.top + br.bottom)/2 - cr.top) / scale;
    const mx = (x1 + x2) / 2;
    const col = getComputedStyle(b).getPropertyValue('--c').trim() || '#2DD4BF';
    out += '<path d="M ' + x1 + ' ' + y1 + ' C ' + mx + ' ' + y1 + ', ' + mx + ' ' + y2 + ', ' + x2 + ' ' + y2 + '" stroke="' + col + '"/>';
  }
  svg.innerHTML = out;
}

/* ---------- 搜索 ---------- */
const q = document.getElementById('q');
q.addEventListener('input', ()=>{
  const s = q.value.trim().toLowerCase();
  for(const n of nodes) n.el.classList.remove('hit');
  if(!s){ document.getElementById('hint').textContent = '共 ' + nodes.length + ' 个节点'; redraw(); return; }
  let count = 0, first = null;
  for(const n of nodes){
    if(n.text.toLowerCase().indexOf(s) >= 0){
      n.el.classList.add('hit'); count++;
      if(!first) first = n.el;
      expandAncestors(n.el);
    }
  }
  document.getElementById('hint').textContent = '匹配 ' + count + ' 个节点';
  redraw();
  if(first) setTimeout(()=>first.scrollIntoView({behavior:'smooth', block:'center', inline:'center'}), 60);
});
q.addEventListener('keydown', ev=>{ if(ev.key==='Escape'){ q.value=''; q.dispatchEvent(new Event('input')); } });

/* ---------- 自适应 ---------- */
window.addEventListener('resize', ()=>redraw());
if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>redraw());
new ResizeObserver(()=>redraw()).observe(treeEl);
</script>
