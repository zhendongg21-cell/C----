<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1100" viewBox="0 0 1440 1100"><rect width="1440" height="1100" fill="#FFFFFF"/><text x="48" y="63" fill="#152B37" font-family="Noto Sans SC, sans-serif" font-size="34" font-weight="600" text-anchor="start">PC 健康问答工作流程</text><text x="48" y="106" fill="#56717D" font-family="Noto Sans SC, sans-serif" font-size="20" font-weight="400" text-anchor="start">图 3-4  仅检索本机归档  ·  回答附可追溯来源</text><rect x="80" y="165" width="580" height="92" rx="16" fill="#EAF2F6" stroke="#9BB0BA"/><text x="370.0" y="204.0" fill="#152B37" font-family="Noto Sans SC, sans-serif" font-size="23" font-weight="600" text-anchor="middle">UI-PC-01 选择设备和时间范围</text><text x="370.0" y="236.0" fill="#56717D" font-family="Noto Sans SC, sans-serif" font-size="19" font-weight="400" text-anchor="middle">默认当前设备近 7 天</text><rect x="780" y="165" width="580" height="92" rx="16" fill="#EAF2F6" stroke="#9BB0BA"/><text x="1070.0" y="204.0" fill="#152B37" font-family="Noto Sans SC, sans-serif" font-size="23" font-weight="600" text-anchor="middle">UI-PC-02 输入问题</text><text x="1070.0" y="236.0" fill="#56717D" font-family="Noto Sans SC, sans-serif" font-size="19" font-weight="400" text-anchor="middle">回车 / 点击询问</text><path d="M660,211 L780,211" fill="none" stroke="#087F6B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M770.0950818741205,215.78462087522354 L780,211 L770.0950818741205,206.21537912477646" fill="none" stroke="#087F6B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="780" y="350" width="580" height="110" rx="16" fill="#EAF2F6" stroke="#9BB0BA"/><text x="1070.0" y="398.0" fill="#152B37" font-family="Noto Sans SC, sans-serif" font-size="23" font-weight="600" text-anchor="middle">检索 SQLite records / events</text><text x="1070.0" y="430.0" fill="#56717D" font-family="Noto Sans SC, sans-serif" font-size="19" font-weight="400" text-anchor="middle">按设备与时间范围检索 Top-K</text><path d="M1070,257 L1070,350" fill="none" stroke="#087F6B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M1065.2153791247765,340.0950818741206 L1070,350 L1074.7846208752235,340.0950818741206" fill="none" stroke="#087F6B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="780" y="560" width="580" height="110" rx="16" fill="#EAF2F6" stroke="#9BB0BA"/><text x="1070.0" y="608.0" fill="#152B37" font-family="Noto Sans SC, sans-serif" font-size="23" font-weight="600" text-anchor="middle">存在可用来源</text><text x="1070.0" y="640.0" fill="#56717D" font-family="Noto Sans SC, sans-serif" font-size="19" font-weight="400" text-anchor="middle">送入大模型  模型状态推理中</text><path d="M1070,460 L1070,560" fill="none" stroke="#087F6B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M1065.2153791247765,550.0950818741205 L1070,560 L1074.7846208752235,550.0950818741205" fill="none" stroke="#087F6B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="1110" y="518" fill="#56717D" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="400" text-anchor="middle">有来源</text><rect x="80" y="560" width="580" height="110" rx="16" fill="#EAF2F6" stroke="#9BB0BA"/><text x="370.0" y="608.0" fill="#152B37" font-family="Noto Sans SC, sans-serif" font-size="23" font-weight="600" text-anchor="middle">无来源 / 数据不足</text><text x="370.0" y="640.0" fill="#56717D" font-family="Noto Sans SC, sans-serif" font-size="19" font-weight="400" text-anchor="middle">提示调整范围或补充归档 不生成结论</text><path d="M780,405 L370,405 L370,560" fill="none" stroke="#087F6B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M365.21537912477646,550.0950818741205 L370,560 L374.78462087522354,550.0950818741205" fill="none" stroke="#087F6B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="438" y="468" fill="#56717D" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="400" text-anchor="middle">无来源</text><rect x="780" y="800" width="580" height="140" rx="16" fill="#EAF2F6" stroke="#9BB0BA"/><text x="1070.0" y="863.0" fill="#152B37" font-family="Noto Sans SC, sans-serif" font-size="23" font-weight="600" text-anchor="middle">显示回答与至少 1 张来源卡</text><text x="1070.0" y="895.0" fill="#56717D" font-family="Noto Sans SC, sans-serif" font-size="19" font-weight="400" text-anchor="middle">左侧来源 右侧回答  ·  设备 时间段 原始数值</text><path d="M1070,670 L1070,800" fill="none" stroke="#087F6B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M1065.2153791247765,790.0950818741205 L1070,800 L1074.7846208752235,790.0950818741205" fill="none" stroke="#087F6B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="80" y="800" width="580" height="140" rx="16" fill="#EAF2F6" stroke="#9BB0BA"/><text x="370.0" y="863.0" fill="#152B37" font-family="Noto Sans SC, sans-serif" font-size="23" font-weight="600" text-anchor="middle">模型失败时显示错误摘要</text><text x="370.0" y="895.0" fill="#56717D" font-family="Noto Sans SC, sans-serif" font-size="19" font-weight="400" text-anchor="middle">显示错误码 支持复制 允许重试</text><path d="M780,615 L708,615 L708,750 L370,750 L370,800" fill="none" stroke="#087F6B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M365.21537912477646,790.0950818741205 L370,800 L374.78462087522354,790.0950818741205" fill="none" stroke="#087F6B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="600" y="732" fill="#56717D" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="400" text-anchor="middle">失败</text><text x="720" y="1032" fill="#56717D" font-family="Noto Sans SC, sans-serif" font-size="21" font-weight="400" text-anchor="middle">免责声明常驻  ·  导出包含来源与免责声明  ·  清空会话不删除归档</text></svg>