<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1470" viewBox="0 0 1440 1470"><rect width="1440" height="1470" fill="#FFFFFF"/><text x="48" y="63" fill="#152B37" font-family="Noto Sans SC, sans-serif" font-size="34" font-weight="600" text-anchor="start">久坐提醒工作流程</text><text x="48" y="106" fill="#56717D" font-family="Noto Sans SC, sans-serif" font-size="20" font-weight="400" text-anchor="start">图 3-2  察觉  提醒  反馈  ·  示例起点为 UI-01</text><rect x="470" y="145" width="500" height="76" rx="16" fill="#EAF2F6" stroke="#9BB0BA"/><text x="720.0" y="176.0" fill="#152B37" font-family="Noto Sans SC, sans-serif" font-size="23" font-weight="600" text-anchor="middle">UI-01 查看步数</text><text x="720.0" y="208.0" fill="#56717D" font-family="Noto Sans SC, sans-serif" font-size="19" font-weight="400" text-anchor="middle">Active / Sitting</text><rect x="470" y="270" width="500" height="96" rx="16" fill="#EAF2F6" stroke="#9BB0BA"/><text x="720.0" y="311.0" fill="#152B37" font-family="Noto Sans SC, sans-serif" font-size="23" font-weight="600" text-anchor="middle">静坐累计达到阈值</text><text x="720.0" y="343.0" fill="#56717D" font-family="Noto Sans SC, sans-serif" font-size="19" font-weight="400" text-anchor="middle">默认 45 min  ·  演示模式 60 s</text><path d="M720,221 L720,270" fill="none" stroke="#087F6B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M715.2153791247765,260.0950818741206 L720,270 L724.7846208752235,260.0950818741206" fill="none" stroke="#087F6B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="470" y="425" width="500" height="96" rx="16" fill="#FFF3DB" stroke="#E0C38F"/><text x="720.0" y="466.0" fill="#152B37" font-family="Noto Sans SC, sans-serif" font-size="23" font-weight="600" text-anchor="middle">UI-07 弹窗并震动</text><text x="720.0" y="498.0" fill="#56717D" font-family="Noto Sans SC, sans-serif" font-size="19" font-weight="400" text-anchor="middle">2 s 震动 / 1 s 间隔 × 3  ·  禁止翻页</text><path d="M720,366 L720,425" fill="none" stroke="#087F6B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M715.2153791247765,415.0950818741206 L720,425 L724.7846208752235,415.0950818741206" fill="none" stroke="#087F6B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="882" y="402" fill="#56717D" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="400" text-anchor="middle">非免打扰且已佩戴</text><rect x="55" y="600" width="380" height="106" rx="16" fill="#EAF2F6" stroke="#9BB0BA"/><text x="245.0" y="646.0" fill="#152B37" font-family="Noto Sans SC, sans-serif" font-size="23" font-weight="600" text-anchor="middle">已起身 / 走 30 步</text><text x="245.0" y="678.0" fill="#56717D" font-family="Noto Sans SC, sans-serif" font-size="19" font-weight="400" text-anchor="middle">清零计时 记录反馈</text><rect x="520" y="600" width="400" height="106" rx="16" fill="#EAF2F6" stroke="#9BB0BA"/><text x="720.0" y="646.0" fill="#152B37" font-family="Noto Sans SC, sans-serif" font-size="23" font-weight="600" text-anchor="middle">稍后 10 分钟</text><text x="720.0" y="678.0" fill="#56717D" font-family="Noto Sans SC, sans-serif" font-size="19" font-weight="400" text-anchor="middle">或 60 s 无操作自动稍后</text><rect x="1005" y="600" width="380" height="106" rx="16" fill="#EAF2F6" stroke="#9BB0BA"/><text x="1195.0" y="646.0" fill="#152B37" font-family="Noto Sans SC, sans-serif" font-size="23" font-weight="600" text-anchor="middle">免打扰 Quiet</text><text x="1195.0" y="678.0" fill="#56717D" font-family="Noto Sans SC, sans-serif" font-size="19" font-weight="400" text-anchor="middle">暂停提醒 不清除计时</text><path d="M580,521 L580,557 L245,557 L245,600" fill="none" stroke="#087F6B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M240.21537912477646,590.0950818741205 L245,600 L249.78462087522354,590.0950818741205" fill="none" stroke="#087F6B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M720,521 L720,600" fill="none" stroke="#087F6B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M715.2153791247765,590.0950818741205 L720,600 L724.7846208752235,590.0950818741205" fill="none" stroke="#087F6B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M970,318 L1195,318 L1195,600" fill="none" stroke="#087F6B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M1190.2153791247765,590.0950818741205 L1195,600 L1199.7846208752235,590.0950818741205" fill="none" stroke="#087F6B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="1290" y="432" fill="#56717D" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="400" text-anchor="middle">处于免打扰</text><rect x="55" y="810" width="380" height="96" rx="16" fill="#EAF2F6" stroke="#9BB0BA"/><text x="245.0" y="851.0" fill="#152B37" font-family="Noto Sans SC, sans-serif" font-size="23" font-weight="600" text-anchor="middle">回到 Active</text><text x="245.0" y="883.0" fill="#56717D" font-family="Noto Sans SC, sans-serif" font-size="19" font-weight="400" text-anchor="middle">关闭覆盖层 返回被覆盖页</text><path d="M245,706 L245,810" fill="none" stroke="#087F6B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M240.21537912477646,800.0950818741205 L245,810 L249.78462087522354,800.0950818741205" fill="none" stroke="#087F6B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M720,780 L945,858 L720,936 L495,858 Z" fill="#EAF2F6" stroke="#9BB0BA" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="720" y="851" fill="#152B37" font-family="Noto Sans SC, sans-serif" font-size="23" font-weight="600" text-anchor="middle">稍后次数 &lt; 3？</text><text x="720" y="884" fill="#56717D" font-family="Noto Sans SC, sans-serif" font-size="19" font-weight="400" text-anchor="middle">上限后策略待确认</text><path d="M720,706 L720,780" fill="none" stroke="#087F6B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M715.2153791247765,770.0950818741205 L720,780 L724.7846208752235,770.0950818741205" fill="none" stroke="#087F6B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="520" y="1000" width="400" height="96" rx="16" fill="#EAF2F6" stroke="#9BB0BA"/><text x="720.0" y="1041.0" fill="#152B37" font-family="Noto Sans SC, sans-serif" font-size="23" font-weight="600" text-anchor="middle">Snoozed 等待 10 min</text><text x="720.0" y="1073.0" fill="#56717D" font-family="Noto Sans SC, sans-serif" font-size="19" font-weight="400" text-anchor="middle">稍后计数加 1  ·  再进入 UI-07</text><path d="M720,936 L720,1000" fill="none" stroke="#087F6B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M715.2153791247765,990.0950818741205 L720,1000 L724.7846208752235,990.0950818741205" fill="none" stroke="#087F6B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="748" y="972" fill="#56717D" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="400" text-anchor="middle">是</text><path d="M520,1048 L452,1048 L452,473 L470,473" fill="none" stroke="#087F6B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M460.0950818741206,477.78462087522354 L470,473 L460.0950818741206,468.21537912477646" fill="none" stroke="#087F6B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="360" y="765" fill="#56717D" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="400" text-anchor="middle">再次提醒</text><rect x="1005" y="1000" width="380" height="96" rx="16" fill="#F4F5F6" stroke="#9BB0BA"/><text x="1195.0" y="1041.0" fill="#152B37" font-family="Noto Sans SC, sans-serif" font-size="23" font-weight="600" text-anchor="middle">已达到稍后上限</text><text x="1195.0" y="1073.0" fill="#56717D" font-family="Noto Sans SC, sans-serif" font-size="19" font-weight="400" text-anchor="middle">不在设计稿中擅定后续动作</text><path d="M945,858 L1195,858 L1195,1000" fill="none" stroke="#087F6B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M1190.2153791247765,990.0950818741205 L1195,1000 L1199.7846208752235,990.0950818741205" fill="none" stroke="#087F6B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="1218" y="947" fill="#56717D" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="400" text-anchor="middle">否</text><rect x="55" y="1194" width="1330" height="100" rx="16" fill="#EAF2F6" stroke="#9BB0BA"/><text x="720.0" y="1237.0" fill="#152B37" font-family="Noto Sans SC, sans-serif" font-size="23" font-weight="600" text-anchor="middle">离腕显示 WearOff  ·  佩戴恢复后重新判断</text><text x="720.0" y="1269.0" fill="#56717D" font-family="Noto Sans SC, sans-serif" font-size="19" font-weight="400" text-anchor="middle">静坐判定与 PC 联动彼此独立  ·  主流程返回 UI-01 因其为提醒前页面</text><text x="56" y="1370" fill="#56717D" font-family="Noto Sans SC, sans-serif" font-size="20" font-weight="400" text-anchor="start">说明：原说明书未明确第 3 次稍后到期后的自动处理方式；此处保留需求待确认项。</text></svg>